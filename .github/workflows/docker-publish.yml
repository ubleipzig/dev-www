name: Build and publish Docker image

on:
  push:
    tags:
      - 'release/**'

env:
  REGISTRY: docker.io
  IMAGE_NAME: ubleipzig/dev-www

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine image tags
        id: tags
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          # Tag format: release/<major.minor-patch>, e.g. release/8.2-4
          version="${GITHUB_REF_NAME#release/}"
          major="${version%%.*}"
          rest="${version#*.}"          # e.g. "2-4"
          minor="${rest%%-*}"           # e.g. "2"

          echo "VERSION=${version}"     >> "${GITHUB_OUTPUT}"
          echo "TAGS=${IMAGE_NAME}:latest,${IMAGE_NAME}:${version},${IMAGE_NAME}:${major}.${minor},${IMAGE_NAME}:${major}" >> "${GITHUB_OUTPUT}"

          echo "Building and publishing ${version}"
          echo "Tags: ${IMAGE_NAME}:latest, ${IMAGE_NAME}:${version}, ${IMAGE_NAME}:${major}.${minor}, ${IMAGE_NAME}:${major}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
